name: Build API Drop (Windows, macOS, Linux)

# Läuft automatisch, wenn ein Version-Tag gepusht wird (z.B. v1.0.0),
# oder manuell über den "Run workflow"-Knopf im Actions-Tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ApiDrop-windows
            artifact_path: |
              dist/ApiDrop.exe
              dist/cli/apidrop.exe
          - os: macos-latest
            artifact_name: ApiDrop-macos
            artifact_path: dist/ApiDrop.dmg
          - os: ubuntu-latest
            artifact_name: ApiDrop-linux
            artifact_path: dist/ApiDrop

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Systempakete für Qt (nur Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bauen (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --windowed --name ApiDrop
          --add-data "logo_full_mint.svg;."
          --add-data "logo_icon_mint.svg;."
          --add-data "assets/icons/apidrop_512.png;assets/icons"
          --icon "assets/icons/ApiDrop.ico"
          app.py

      # Eigener Ordner: Windows unterscheidet ApiDrop.exe / apidrop.exe nicht
      - name: Kommandozeilen-Tool bauen (Windows, apidrop.exe)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --console --name apidrop
          --distpath dist/cli --workpath build/cli --specpath build/cli
          --icon "${{ github.workspace }}/assets/icons/ApiDrop.ico"
          apidrop_cli.py

      - name: Bauen (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --onefile --windowed --name ApiDrop
          --add-data "logo_full_mint.svg:."
          --add-data "logo_icon_mint.svg:."
          --add-data "assets/icons/apidrop_512.png:assets/icons"
          app.py

      - name: Bauen (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name ApiDrop \
            --add-data "logo_full_mint.svg:." \
            --add-data "logo_icon_mint.svg:." \
            --add-data "assets/icons/apidrop_512.png:assets/icons" \
            --icon "assets/icons/ApiDrop.icns" \
            --osx-bundle-identifier "com.letaiwork4u.apidrop" \
            app.py
          # Version aus app.py ins Bundle schreiben (vor dem Signieren)
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('app.py').read()).group(1))")
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/ApiDrop.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/ApiDrop.app/Contents/Info.plist

      # Nur wenn die Secrets hinterlegt sind: Developer-ID-Zertifikat in einen
      # temporären Schlüsselbund importieren. Ohne Secrets bleibt es bei ad-hoc.
      - name: Developer-ID-Zertifikat importieren (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "Keine Signier-Secrets hinterlegt - ad-hoc-Build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Signieren, DMG, Notarisieren (macOS)
        if: runner.os == 'macOS'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/macos_sign.sh dist/ApiDrop.app dist/ApiDrop.dmg

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # Bei einem Version-Tag: alle drei Builds an ein Release hängen
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte holen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Dateien sammeln + SHA256-Prüfsummen
        run: |
          mkdir -p release
          cp artifacts/ApiDrop-windows/ApiDrop.exe release/
          # apidrop.exe im ZIP: Windows/macOS unterscheiden ApiDrop.exe und apidrop.exe nicht
          (cd artifacts/ApiDrop-windows/cli && zip -q ../../../release/apidrop-cli-windows.zip apidrop.exe)
          cp artifacts/ApiDrop-macos/ApiDrop.dmg release/
          cp artifacts/ApiDrop-linux/ApiDrop release/
          cd release && sha256sum ApiDrop.exe apidrop-cli-windows.zip ApiDrop.dmg ApiDrop > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ApiDrop.exe
            release/apidrop-cli-windows.zip
            release/ApiDrop.dmg
            release/ApiDrop
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
