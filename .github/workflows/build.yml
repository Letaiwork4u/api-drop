name: Build API Drop (Windows, macOS, Linux)

# Läuft automatisch, wenn ein Version-Tag gepusht wird (z.B. v1.0.0),
# oder manuell über den "Run workflow"-Knopf im Actions-Tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ApiDrop-windows
            artifact_path: dist/ApiDrop.exe
          - os: macos-latest
            artifact_name: ApiDrop-macos
            artifact_path: dist/ApiDrop.dmg
          - os: ubuntu-latest
            artifact_name: ApiDrop-linux
            artifact_path: dist/ApiDrop

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Systempakete für Qt (nur Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bauen (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --windowed --name ApiDrop
          --add-data "logo_full_mint.svg;."
          --add-data "logo_icon_mint.svg;."
          app.py

      - name: Bauen (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --onefile --windowed --name ApiDrop
          --add-data "logo_full_mint.svg:."
          --add-data "logo_icon_mint.svg:."
          app.py

      - name: Bauen (macOS) + DMG erzeugen
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name ApiDrop \
            --add-data "logo_full_mint.svg:." \
            --add-data "logo_icon_mint.svg:." \
            app.py
          mkdir -p dist/dmg
          cp -R "dist/ApiDrop.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "API Drop" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/ApiDrop.dmg

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # Bei einem Version-Tag: alle drei Builds an ein Release hängen
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte holen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
